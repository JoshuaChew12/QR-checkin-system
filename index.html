<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial; text-align:center; padding:20px; }

button { padding:16px; margin:10px; font-size:18px; }
input { padding:14px; font-size:18px; width:220px; }

#scanner { width:320px; margin:auto; }

.success { background:#d4edda; }
.duplicate { background:#fff3cd; }
.error { background:#f8d7da; }
</style>
</head>

<body>

<h2>Check-in System</h2>

<!-- HOME -->
<div id="home">
  <button onclick="openScan()">📷 Scan QR</button>
  <button onclick="openManual()">⌨️ Manual Input</button>
</div>

<!-- SCAN -->
<div id="scanPage" style="display:none;">
  <h3>Scan QR Code</h3>
  <div id="scanner"></div>
  <button onclick="goHome()">⬅️ Back</button>
</div>

<!-- MANUAL -->
<div id="manualPage" style="display:none;">
  <h3>Manual Check-in</h3>

  <input id="idInput" placeholder="Enter ID"
    onkeypress="if(event.key==='Enter') manualCheck()">

  <br><br>
  <button onclick="manualCheck()">Check-in</button>
  <br>
  <button onclick="goHome()">⬅️ Back</button>
</div>

<!-- RESULT -->
<div id="resultPage" style="display:none;">
  <div id="resultContent"></div>
  <br><br>
  <button onclick="nextAction()">Submit Another</button>
  <button onclick="goHome()">Home</button>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzmvjnDc8Rqek-d-aN0XeGlB4nwyn2sN0aGhswul1c_Z3sWsbigBFgweNo3GnWns-8p/exec";

let scanner = null;
let scanning = false;
let currentMode = "";
let isProcessing = false;

// 🔥 JSONP 请求（核心）
function callAPI(id) {

  showLoading();

  const callbackName = "cb_" + Date.now();

  window[callbackName] = function(data) {
    handleResult(data);
    delete window[callbackName];
  };

  const script = document.createElement("script");

  script.src = API_URL +
    "?action=checkin&id=" + encodeURIComponent(id) +
    "&callback=" + callbackName;

  script.onerror = function() {
    handleResult({
      type: "error",
      message: "Request Failed"
    });
  };

  document.body.appendChild(script);
}

// 📷 Scan
function openScan() {
  currentMode = "scan";

  hideAll();
  document.getElementById("scanPage").style.display = "block";

  document.getElementById("scanner").innerHTML = "";

  if (!scanner) {
    scanner = new Html5Qrcode("scanner");
  }

  scanning = true;

  scanner.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: 250 },
    onScanSuccess
  );
}

async function onScanSuccess(text) {
  if (!scanning || isProcessing) return;

  isProcessing = true;
  scanning = false;

  try { await scanner.stop(); } catch(e) {}

  callAPI(text);

  isProcessing = false;
}

// ⌨️ Manual
function openManual() {
  currentMode = "manual";
  hideAll();
  document.getElementById("manualPage").style.display = "block";
  document.getElementById("idInput").value = "";
  document.getElementById("idInput").focus();
}

function manualCheck() {
  const id = document.getElementById("idInput").value.trim();
  if (!id) return;

  callAPI(id);
}

// 🎯 Result
function handleResult(data) {

  hideAll();
  document.getElementById("resultPage").style.display = "block";

  let html = "";

  if (data.type === "success") {

    document.body.className = "success";

    html = `
      <h1>${data.chineseName}</h1>
      <h2>${data.englishName}</h2>
      <h2>✅ Checked In</h2>
      <p>${data.time}</p>
    `;

  } else if (data.type === "duplicate") {

    document.body.className = "duplicate";

    html = `
      <h2>⚠️ Already Checked In</h2>
      <h1>${data.chineseName}</h1>
      <p>${data.englishName}</p>
      <p>${data.time}</p>
    `;

  } else {

    document.body.className = "error";

    html = <h2>❌ ${data.message}</h2>;
  }

  document.getElementById("resultContent").innerHTML = html;
}

// 🔁 Next
function nextAction() {
  if (currentMode === "scan") {
    openScan();
  } else {
    openManual();
  }
}

// 🏠 Home
async function goHome() {

  hideAll();
  document.getElementById("home").style.display = "block";

  if (scanner && scanning) {
    try { await scanner.stop(); } catch(e) {}
    scanning = false;
  }
}

// UI
function showLoading() {
  hideAll();
  document.getElementById("resultPage").style.display = "block";
  document.getElementById("resultContent").innerHTML =
    "<h2>⏳ Checking...</h2>";
}

function hideAll() {
  document.getElementById("home").style.display = "none";
  document.getElementById("scanPage").style.display = "none";
  document.getElementById("manualPage").style.display = "none";
  document.getElementById("resultPage").style.display = "none";
}

</script>

</body>
</html>
