<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial; text-align: center; padding: 20px; }

button { padding:16px; margin:10px; font-size:18px; }
input { padding:14px; font-size:18px; width:220px; }

#scanner { width:320px; margin:auto; }

.success { background:#d4edda; }
.duplicate { background:#fff3cd; }
.error { background:#f8d7da; }
</style>
</head>

<body>

<h2>Check-in System</h2>

<!-- HOME -->
<div id="home">
  <button onclick="openScan()">📷 Scan QR</button>
  <button onclick="openManual()">⌨️ Manual Input</button>
</div>

<!-- SCAN -->
<div id="scanPage" style="display:none;">
  <h3>Scan QR Code</h3>
  <div id="scanner"></div>

  <br>

  <button onclick="goHome()">⬅️ Back</button>
</div>

<!-- MANUAL -->
<div id="manualPage" style="display:none;">
  <h3>Manual Check-in</h3>

  <input id="idInput" placeholder="Enter ID"
    onkeypress="if(event.key==='Enter') manualCheck()">

  <br><br>

  <button onclick="manualCheck()">Check-in</button>

  <br>

  <button onclick="goHome()">⬅️ Back</button>
</div>

<!-- RESULT -->
<div id="resultPage" style="display:none; padding:30px;">
  <div id="resultContent"></div>

  <br><br>

  <button onclick="nextAction()">Submit Another</button>
  <button onclick="goHome()">Home</button>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzmvjnDc8Rqek-d-aN0XeGlB4nwyn2sN0aGhswul1c_Z3sWsbigBFgweNo3GnWns-8p/exec";

let scanner;
let scanning = false;
let currentMode = "";

// 📷 Scan
function openScan() {
  currentMode = "scan";

  hideAll();
  document.getElementById("scanPage").style.display = "block";

  scanner = new Html5Qrcode("scanner");
  scanning = true;

  scanner.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: 250 },
    onScanSuccess
  );
}

function onScanSuccess(text) {
  if (!scanning) return;

  scanning = false;
  scanner.stop();

  showLoading();

  fetch(API_URL + "?action=checkin&id=" + text)
    .then(res => res.json())
    .then(showResult);
}

// ⌨️ Manual
function openManual() {
  currentMode = "manual";

  hideAll();
  document.getElementById("manualPage").style.display = "block";

  document.getElementById("idInput").value = "";
  document.getElementById("idInput").focus();
}

function manualCheck() {
  const id = document.getElementById("idInput").value.trim();
  if (!id) return;

  showLoading();

  fetch(API_URL + "?action=checkin&id=" + id)
    .then(res => res.json())
    .then(showResult);
}

// ⏳ Loading
function showLoading() {
  hideAll();
  document.getElementById("resultPage").style.display = "block";
  document.getElementById("resultContent").innerHTML =
    "<div style='font-size:40px;'>⏳ Checking...</div>";
}

// 🎯 Result
function showResult(data) {

  const page = document.getElementById("resultPage");
  let html = "";

  const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
  if (navigator.vibrate) navigator.vibrate(100);

  if (data.type === "success") {

    page.className = "success";

    html = `
      <div style="font-size:70px; font-weight:bold; color:green;">
        ${data.chineseName}
      </div>

      <div style="font-size:40px;">
        ${data.englishName}
      </div>

      <br>

      <div style="font-size:30px;">Checked In</div>

      <div style="font-size:26px;">
        ${data.time}
      </div>
    `;

    beep.play();

  } else if (data.type === "duplicate") {

    page.className = "duplicate";

    html = `
      <div style="font-size:50px; color:orange; font-weight:bold;">
        Already Checked In
      </div>

      <br>

      <div style="font-size:60px;">
        ${data.chineseName}
      </div>

      <div style="font-size:40px;">
        ${data.englishName}
      </div>

      <br>

      <div style="font-size:28px;">Check-in Time</div>

      <div style="font-size:32px;">
        ${data.time}
      </div>
    `;

  } else {

    page.className = "error";

    html = `
      <div style="font-size:50px; color:red;">
        ${data.message}
      </div>
    `;
  }

  document.getElementById("resultContent").innerHTML = html;
}

// 🔁 Submit Another
function nextAction() {
  if (currentMode === "scan") {
    openScan();
  } else if (currentMode === "manual") {
    openManual();
  }
}

// 🏠 Home（统一入口）
function goHome() {
  location.reload();
}

// 工具
function hideAll() {
  document.getElementById("home").style.display = "none";
  document.getElementById("scanPage").style.display = "none";
  document.getElementById("manualPage").style.display = "none";
  document.getElementById("resultPage").style.display = "none";
}

</script>

</body>
</html>
